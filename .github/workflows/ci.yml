name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # A lockfile that does not match package.json fails here rather than silently re-resolving.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm i18n:check
      # Generated contract types must match api/openapi.yaml.
      - run: pnpm contract:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests start PostgreSQL and Redis with Testcontainers (Docker is preinstalled on the runner).
      - run: pnpm test
      - run: pnpm build
      - name: Contract coverage
        run: pnpm contract:coverage
