# The production stack: the server with PostgreSQL and Redis.
#   cp deploy/.env.example deploy/.env      # then set APP_SECRET and POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: agent-base
services:
  server:
    image: agent-base-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://agentbase:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agentbase
      REDIS_URL: redis://redis:6379/0
      APP_SECRET: ${APP_SECRET:?set APP_SECRET (32+ random characters)}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Uploads wait here until they are delivered to a device. Projects themselves stay on devices.
      STORAGE_DIR: /data/storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-0}
    volumes:
      - server-data:/data
    ports:
      # Bound to localhost by default: put a TLS-terminating proxy in front, or set BIND=0.0.0.0.
      - "${BIND:-127.0.0.1}:${PORT:-8787}:8787"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agentbase
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbase"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions' refresh tokens and device presence live here; keep them across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  server-data:
  pg-data:
  redis-data:
